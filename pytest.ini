[pytest]
testpaths = tests
# Fase 5 (audit #6): setiap uji dicetak satu baris beserta hasilnya (PASSED/FAILED) dan persentase
# kemajuan; ringkasan alasan uji yang gagal/dilewati (-ra) dan 5 uji paling lambat ditampilkan di akhir.
# Jangan menambahkan -q saat menjalankan: -q membatalkan -v sehingga yang terlihat hanya titik-titik.
addopts = -v -ra --durations=5
console_output_style = progress
# Peringatan usang dari pustaka pihak ketiga (bukan kode kita) disembunyikan agar keluaran tetap bersih.
filterwarnings =
    ignore::DeprecationWarning:starlette.*
